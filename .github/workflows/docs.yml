name: Docs

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  CLOUDFLARE_PROJECT_NAME: zodline-page
  NODE_VERSION: 24
  WRANGLER_VERSION: 4.78.0

jobs:
  deploy:
    name: Deploy
    if: github.repository == 'capawesome-team/zodline'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history so blume can derive per-page lastModified / sitemap
          # <lastmod> from git commit times (shallow clone dates them all alike).
          fetch-depth: 0
      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build docs
        run: npm run docs:build
        env:
          # Lets the github-releases content source populate the /changelog timeline.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        id: cloudflare-deployment
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .blume-dist --project-name ${{
            env.CLOUDFLARE_PROJECT_NAME }} --branch ${{ github.ref_name }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
      - name: Comment the preview url
        if: github.event_name == 'pull_request'
        uses: peter-evans/create-or-update-comment@23ff15729ef2fc348714a3bb66d2f655ca9066f2 # v3.1.0
        with:
          issue-number: ${{ github.event.number }}
          body: |
            Deploy preview available at: ${{ steps.cloudflare-deployment.outputs.deployment-url }}.

            Built with commit ${{ github.event.pull_request.head.sha }}.
